<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BouyUp Chain Explorer</title>
<style>
:root{
  --bg:#f5f6f8; --panel:#ffffff; --ink:#16181d; --muted:#667085; --line:#e4e7ec; --soft:#f0f2f5;
  --brand:#0f6b5c; --brand-ink:#ffffff; --ok:#12805c; --ok-bg:#e7f6ef; --bad:#b42318; --bad-bg:#fdecea;
  --warn:#b54708; --warn-bg:#fef4e6; --link:#0b5cad; --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0e1116; --panel:#161b22; --ink:#e6e8eb; --muted:#9aa4b2; --line:#2a313c; --soft:#1d232c;
  --brand:#2bb39a; --brand-ink:#06201b; --ok:#3ccf91; --ok-bg:#10291f; --bad:#ff7b72; --bad-bg:#3a1714;
  --warn:#f0b35a; --warn-bg:#33240e; --link:#6cb6ff;
}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:var(--link);text-decoration:none} a:hover{text-decoration:underline}
header{background:var(--brand);color:var(--brand-ink)}
.bar{max-width:1180px;margin:0 auto;padding:14px 16px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.logo{font-weight:700;font-size:17px;letter-spacing:.2px;color:var(--brand-ink)} .logo small{font-weight:500;opacity:.8;margin-left:6px}
form{flex:1;display:flex;min-width:240px}
input[type=search]{flex:1;border:0;border-radius:8px 0 0 8px;padding:10px 12px;font:inherit;background:var(--panel);color:var(--ink)}
button{font:inherit;cursor:pointer}
form button{border:0;border-radius:0 8px 8px 0;padding:0 16px;background:var(--ink);color:var(--panel);font-weight:600}
main{max-width:1180px;margin:0 auto;padding:20px 16px 48px}
.grid{display:grid;gap:16px}
.stats{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.two{grid-template-columns:repeat(auto-fit,minmax(420px,1fr))}
@media (max-width:520px){.two{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.card h2{font-size:14px;margin:0;padding:12px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.stat{padding:14px 16px} .stat .k{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.4px} .stat .v{font-size:22px;font-weight:650;margin-top:2px}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:10px 16px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:600;background:var(--soft)}
tr:last-child td{border-bottom:0}
.kv td:first-child{width:220px;color:var(--muted)}
@media (max-width:640px){.kv td{display:block;width:auto!important;border:0;padding:4px 16px}.kv tr{display:block;border-bottom:1px solid var(--line);padding:6px 0}}
.mono{font-family:var(--mono);font-size:12.5px;word-break:break-all}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600}
.ok{background:var(--ok-bg);color:var(--ok)} .bad{background:var(--bad-bg);color:var(--bad)} .warn{background:var(--warn-bg);color:var(--warn)}
.muted{color:var(--muted)} .right{text-align:right}
.copy{border:1px solid var(--line);background:var(--soft);color:var(--muted);border-radius:6px;padding:0 6px;margin-left:6px;font-size:11px}
.title{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin:4px 0 16px} .title h1{font-size:20px;margin:0}
.bar-split{display:flex;height:10px;border-radius:6px;overflow:hidden;margin:12px 16px 4px;background:var(--soft)}
.bar-split span{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:12px;padding:6px 16px 14px;font-size:12px} .legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.nodes{display:flex;flex-wrap:wrap;gap:8px;padding:12px 16px}
.node{border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-width:150px}
.node b{display:block} .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
.empty{padding:24px 16px;color:var(--muted)}
.err{padding:16px;border-radius:10px;background:var(--bad-bg);color:var(--bad)}
.note{font-size:12px;color:var(--muted);padding:0 16px 14px}
.scroll{overflow-x:auto}
textarea{width:100%;min-height:64px;font-family:var(--mono);font-size:12.5px;border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--soft);color:var(--ink);resize:vertical}
.btn{border:0;border-radius:8px;padding:8px 14px;background:var(--brand);color:var(--brand-ink);font-weight:600;margin-top:8px}
.pad{padding:12px 16px}
.lock{display:inline-block;margin-right:6px}
.toplinks{display:flex;gap:14px;margin-left:auto}.toplinks a{color:inherit;opacity:.85;text-decoration:none;font-weight:600}.toplinks a:hover{opacity:1;text-decoration:underline}
</style>
</head>
<body>
<header><div class="bar">
  <a class="logo" href="#/">BouyUp Explorer<small>FISCO BCOS</small></a>
  <form id="search"><input type="search" id="q" placeholder="Search by withdrawal ID, transaction hash or block number" aria-label="Search"><button>Search</button></form>
  <nav class="toplinks"><a href="../overview/">Overview</a><a href="../docs/">API</a></nav>
</div></header>
<main id="app"><div class="empty">Loading…</div></main>
<script>
const $ = s => document.querySelector(s);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const COLORS = ['#0f6b5c','#2f80ed','#f2994a','#9b51e0','#eb5757','#27ae60','#56ccf2','#bb6bd9'];
const short = h => h && h.length > 20 ? h.slice(0,10)+'…'+h.slice(-8) : (h||'');
const ago = ts => { if(!ts) return ''; const s = Math.max(0, Math.floor(Date.now()/1000 - ts));
  if (s < 60) return s+'s ago'; if (s < 3600) return Math.floor(s/60)+' min ago'; if (s < 86400) return Math.floor(s/3600)+' h ago'; return Math.floor(s/86400)+' d ago'; };
const when = ts => ts ? new Date(ts*1000).toLocaleString() : '';
const minor = {VND:0, CNY:2};
const money = (amt, cur) => { const d = minor[cur] ?? 0; const v = amt / Math.pow(10, d);
  return v.toLocaleString(undefined,{minimumFractionDigits:d,maximumFractionDigits:d}) + ' ' + (cur||''); };
const copyBtn = v => `<button class="copy" data-copy="${esc(v)}" title="Copy">copy</button>`;
const hashCell = (h, href) => h ? `<span class="mono">${href ? `<a href="${href}">${esc(h)}</a>` : esc(h)}</span>${copyBtn(h)}` : '<span class="muted">—</span>';
document.addEventListener('click', e => { const b = e.target.closest('[data-copy]'); if (!b) return;
  navigator.clipboard?.writeText(b.dataset.copy); b.textContent = 'copied'; setTimeout(() => b.textContent = 'copy', 1200); });

async function api(path){ const r = await fetch('api/' + path, {headers:{Accept:'application/json'}});
  const j = await r.json().catch(() => ({})); if (!r.ok) throw new Error(j.error?.message || ('HTTP ' + r.status)); return j; }

function nodesCard(nodes){
  const up = nodes.filter(n => n.online).length;
  return `<div class="card"><h2>Nodes <span class="pill ${up===nodes.length?'ok':'warn'}">${up} / ${nodes.length} online</span></h2><div class="nodes">` +
    nodes.map(n => `<div class="node"><b><span class="dot" style="background:${n.online?'var(--ok)':'var(--bad)'}"></span>${esc(n.name)}${n.sealer?' <span class="muted">· sealer</span>':''}</b>
      <span class="mono muted">${esc(n.url)}</span><br><span class="muted">${n.online ? 'block #' + n.blockNumber : esc(n.error||'offline')}</span>
      ${n.nodeId ? `<br><span class="mono muted" title="${esc(n.nodeId)}">${esc(short(n.nodeId))}</span>` : ''}</div>`).join('') + `</div></div>`;
}

function blocksTable(blocks){
  if (!blocks.length) return '<div class="empty">No blocks yet.</div>';
  return `<div class="scroll"><table><tr><th>Block</th><th>Sealed by</th><th class="right">Txs</th><th>Age</th></tr>` + blocks.map(b =>
    `<tr><td><a href="#/block/${b.number}">#${b.number}</a><br><span class="mono muted">${esc(short(b.hash))}</span></td><td>${esc(b.sealer||'—')}</td>
     <td class="right">${b.txCount}</td><td class="muted">${ago(b.timestamp)}</td></tr>`).join('') + `</table></div>`;
}

function wdTable(items){
  if (!items.length) return '<div class="empty">No withdrawals yet.</div>';
  return `<div class="scroll"><table><tr><th>Withdrawal</th><th>Block</th><th class="right">Pieces</th><th>Age</th></tr>` + items.map(w =>
    `<tr><td><span class="lock">🔒</span><a href="#/withdrawal/${esc(w.withdrawalId)}" class="mono">${esc(w.withdrawalId)}</a></td>
     <td><a href="#/block/${w.blockNumber}">#${w.blockNumber}</a></td><td class="right">${w.pieces}</td>
     <td class="muted">${ago(new Date(w.timestamp).getTime()/1000)}</td></tr>`).join('') + `</table></div>
     <div class="note">Withdrawals are encrypted: open one and decrypt it with a bank key or the BouyUp master key.</div>`;
}

async function home(){
  const o = await api('overview');
  const up = o.nodes.filter(n => n.online).length;
  return `<div class="grid stats">
    <div class="card stat"><div class="k">Latest block</div><div class="v">#${o.chain.blockNumber}</div></div>
    <div class="card stat"><div class="k">Withdrawals recorded</div><div class="v">${o.totalWithdrawals}</div></div>
    <div class="card stat"><div class="k">Nodes online</div><div class="v">${up} / ${o.nodes.length}</div></div>
    <div class="card stat"><div class="k">Backend</div><div class="v" style="font-size:16px">${esc(o.chain.backend)}${o.chain.groupId ? ' · group ' + o.chain.groupId : ''}</div></div>
  </div>
  <div style="height:16px"></div>${nodesCard(o.nodes)}<div style="height:16px"></div>
  <div class="grid two">
    <div class="card"><h2>Latest withdrawals</h2>${wdTable(o.latestWithdrawals)}</div>
    <div class="card"><h2>Latest blocks</h2>${blocksTable(o.latestBlocks)}</div>
  </div>
  <div style="height:16px"></div>
  <div class="card"><h2>Contracts</h2><table class="kv">${Object.entries(o.chain.contracts||{}).map(([k,v]) => `<tr><td>${esc(k)}</td><td>${hashCell(v)}</td></tr>`).join('')}</table></div>`;
}

function splitBar(legs){
  return `<div class="bar-split">${legs.map((l,i) => `<span style="width:${l.percent}%;background:${COLORS[i%COLORS.length]}" title="${esc(l.bank)} ${l.percent}%"></span>`).join('')}</div>
   <div class="legend">${legs.map((l,i) => `<span><i style="background:${COLORS[i%COLORS.length]}"></i>${esc(l.bank)} ${l.percent}%</span>`).join('')}</div>`;
}

function encryptedCard(w){
  return `<div class="card"><h2>Withdrawal <span class="pill warn">🔒 encrypted</span></h2><table class="kv">
    <tr><td>Withdrawal ID</td><td class="mono">${esc(w.withdrawalId)}${copyBtn(w.withdrawalId)}</td></tr>
    <tr><td>Recorded</td><td>block <a href="#/block/${w.blockNumber}">#${w.blockNumber}</a> · ${when(new Date(w.timestamp).getTime()/1000)}</td></tr>
    <tr><td>Encrypted pieces</td><td>${w.pieces} <span class="muted">(1 summary + ${w.pieces-1} bank share${w.pieces-1===1?'':'s'})</span></td></tr>
    <tr><td>Key slots</td><td>${w.slots} <span class="muted">(unnamed: each reader finds its own by trying its key)</span></td></tr>
    <tr><td>Envelope size</td><td>${w.envelopeBytes} bytes</td></tr>
    <tr><td>Merkle root</td><td>${hashCell(w.root)}</td></tr>
    <tr><td>Commitments</td><td>${w.commitments.map((c,i) => `<span class="mono">${i}: ${esc(short(c))}</span>`).join('<br>')}</td></tr>
    <tr><td>Written by</td><td>${hashCell(w.writer)}</td></tr>
  </table><div class="note">Amounts, banks and accounts are not visible here. Each bank can decrypt the summary and its own share; the BouyUp master key decrypts everything.</div></div>`;
}

function decryptPanel(id){
  return `<div class="card"><h2>Decrypt with your key</h2><div class="pad">
    <textarea id="dkey" placeholder="Paste a private key (64 hex characters): a bank key or the BouyUp master key"></textarea>
    <button class="btn" id="dbtn" data-id="${esc(id)}">Decrypt</button>
    <div class="note" style="padding:8px 0 0">The key is sent to this server only for this request and not stored. To decrypt without trusting the server, use <a href="decrypt_withdrawal.py">decrypt_withdrawal.py</a>.</div>
    <div id="dout"></div></div></div>`;
}

function renderDecrypted(d){
  const sum = d.readable.find(p => p.kind === 'summary');
  const shares = d.readable.filter(p => p.kind === 'bank_share');
  const s = sum ? sum.content : null;
  let html = `<div style="height:12px"></div><p><span class="pill ok">✓ this key reads ${d.readable.length} of ${d.piecesTotal} pieces</span>
    ${d.readable.every(p => p.commitmentMatches) ? '<span class="pill ok">✓ every piece matches its on-chain fingerprint</span>' : '<span class="pill bad">a piece does not match its fingerprint</span>'}</p>`;
  if (s) {
    const a = s.actor || {};
    html += `<table class="kv">
      <tr><td>Amount</td><td><b>${money(s.amount, s.currency)}</b></td></tr>
      <tr><td>Region</td><td>${esc(s.region)} · ${esc(s.province)}</td></tr>
      <tr><td>Banks in this withdrawal</td><td>${s.banks}</td></tr>
      <tr><td>Requested by</td><td>${a.type === 'agent' ? `Agent <b>${esc(a.agentId)}</b>, version ${esc(a.version)}` : `Human, role <b>${esc(a.role)}</b>`}</td></tr>
      <tr><td>Target account</td><td>${hashCell(s.accountRef)}</td></tr>
      <tr><td>Payout reference</td><td class="mono">${esc(s.payoutRef)}</td></tr>
      <tr><td>Paid at</td><td>${esc(s.paidAt)}</td></tr></table>`;
  }
  if (shares.length) {
    const legs = shares.map(p => p.content);
    html += `<div style="height:12px"></div>${splitBar(legs)}<div class="scroll"><table><tr><th>Bank</th><th class="right">Share</th><th class="right">Amount</th><th>Contract</th><th>Fingerprint</th></tr>` +
      shares.map(p => { const l = p.content; return `<tr><td><b>${esc(l.bank)}</b> <span class="muted">${esc(l.bankName||'')}</span></td><td class="right">${l.percent}%</td>
        <td class="right">${money(l.amount, l.currency)}</td><td class="mono">${esc(l.contractNo||'')}</td><td><span class="pill ${p.commitmentMatches?'ok':'bad'}">${p.commitmentMatches?'✓ matches':'✗'}</span></td></tr>`; }).join('') + `</table></div>`;
    if (s && shares.length < s.banks) html += `<div class="note" style="padding:8px 0 0">${s.banks - shares.length} other bank share(s) exist but this key cannot read them.</div>`;
  }
  return html;
}

document.addEventListener('click', async e => {
  const b = e.target.closest('#dbtn'); if (!b) return;
  const out = $('#dout'); out.innerHTML = '<div class="empty">Decrypting…</div>';
  try {
    const r = await fetch('api/decrypt', {method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({withdrawalId: b.dataset.id, privateKey: $('#dkey').value.trim()})});
    const j = await r.json(); if (!r.ok) throw new Error(j.error?.message || ('HTTP ' + r.status));
    out.innerHTML = renderDecrypted(j);
  } catch (err) { out.innerHTML = `<div style="height:12px"></div><div class="err">${esc(err.message)}</div>`; }
});

function verifyCard(v){
  if (!v) return '';
  return `<div class="card"><h2>Verification <span class="pill ${v.valid?'ok':'bad'}">${v.valid?'valid':'not valid'}</span></h2><table>` +
    v.checks.map(c => `<tr><td style="width:36px"><span class="pill ${c.ok?'ok':(c.name==='confirmed_on_nodes'?'warn':'bad')}">${c.ok?'✓':'!'}</span></td>
      <td><b>${esc(c.name.replace(/_/g,' '))}</b><br><span class="muted mono">${esc(c.detail)}</span></td></tr>`).join('') + `</table></div>`;
}

function txCard(t){
  return `<div class="card"><h2>Transaction <span class="pill ${t.status==='success'?'ok':'bad'}">${esc(t.status)}</span></h2><table class="kv">
    <tr><td>Transaction hash</td><td>${hashCell(t.hash)}</td></tr>
    <tr><td>Block</td><td><a href="#/block/${t.blockNumber}">#${t.blockNumber}</a> <span class="muted">${when(t.timestamp)} (${ago(t.timestamp)})</span></td></tr>
    <tr><td>Block hash</td><td>${hashCell(t.blockHash)}</td></tr>
    <tr><td>Sealed by</td><td>${esc(t.sealer||'—')} ${t.sealerNodeId?`<br><span class="mono muted">${esc(t.sealerNodeId)}</span>`:''}</td></tr>
    <tr><td>Submitted to</td><td>${esc(t.submittedTo||'—')}</td></tr>
    <tr><td>From</td><td>${hashCell(t.from)} ${t.fromRole?`<span class="pill ok">${esc(t.fromRole)}</span>`:''}</td></tr>
    <tr><td>To</td><td>${hashCell(t.to)} ${t.contract?`<span class="muted">${esc(t.contract)}</span>`:''}</td></tr>
    <tr><td>Method</td><td class="mono">${esc(t.method||'—')}</td></tr>
  </table></div>
  <div style="height:16px"></div>
  <div class="card"><h2>Held by nodes <span class="pill ${t.confirmations.every(c=>c.confirmed)?'ok':'warn'}">${t.confirmations.filter(c=>c.confirmed).length} / ${t.confirmations.length}</span></h2><table>` +
    t.confirmations.map(c => `<tr><td style="width:36px"><span class="pill ${c.confirmed?'ok':'warn'}">${c.confirmed?'✓':'…'}</span></td><td><b>${esc(c.node)}</b> <span class="mono muted">${esc(c.url)}</span>${c.error?`<br><span class="muted">${esc(c.error)}</span>`:(c.confirmed?'':'<br><span class="muted">not yet: this node is still catching up</span>')}</td></tr>`).join('') +
  `</table></div>
  <div style="height:16px"></div>
  <div class="card"><h2>Events (${t.events.length})</h2><div class="scroll"><table><tr><th>Event</th><th>Fields</th></tr>` +
    t.events.map(e => `<tr><td><b>${esc(e.name)}</b></td><td class="mono">${Object.entries(e.fields).map(([k,v]) => `${esc(k)}: ${esc(v)}`).join('<br>')}</td></tr>`).join('') +
  `</table></div></div>`;
}

async function txPage(hash){
  const d = await api('tx/' + encodeURIComponent(hash));
  return `<div class="title"><h1>Transaction</h1><span class="mono muted">${esc(hash)}</span></div>
    ${d.withdrawal ? encryptedCard(d.withdrawal) + '<div style="height:16px"></div>' + decryptPanel(d.withdrawal.withdrawalId) + '<div style="height:16px"></div>' + verifyCard(d.verification) + '<div style="height:16px"></div>' : ''}${txCard(d.transaction)}`;
}

async function wdPage(id){
  const d = await api('withdrawals/' + encodeURIComponent(id));
  const tx = d.withdrawal.txHash;
  return `<div class="title"><h1>Withdrawal</h1><span class="mono muted">${esc(d.withdrawal.withdrawalId)}</span>
    ${tx ? `<a href="#/tx/${esc(tx)}">view transaction →</a>` : ''}</div>
    ${encryptedCard(d.withdrawal)}<div style="height:16px"></div>${decryptPanel(d.withdrawal.withdrawalId)}<div style="height:16px"></div>${verifyCard(d.verification)}`;
}

async function blockPage(n){
  const b = await api('blocks/' + encodeURIComponent(n));
  return `<div class="title"><h1>Block #${b.number}</h1>
    ${b.number > 0 ? `<a href="#/block/${b.number-1}">← previous</a>` : ''} <a href="#/block/${b.number+1}">next →</a></div>
    <div class="card"><h2>Overview</h2><table class="kv">
      <tr><td>Block hash</td><td>${hashCell(b.hash)}</td></tr>
      <tr><td>Parent</td><td>${hashCell(b.parentHash, b.number > 0 ? '#/block/' + (b.number-1) : '')}</td></tr>
      <tr><td>Time</td><td>${when(b.timestamp)} <span class="muted">(${ago(b.timestamp)})</span></td></tr>
      <tr><td>Sealed by</td><td>${esc(b.sealer||'—')} ${b.sealerNodeId?`<br><span class="mono muted">${esc(b.sealerNodeId)}</span>`:''}</td></tr>
      <tr><td>Transactions</td><td>${b.txCount}</td></tr></table></div>
    <div style="height:16px"></div>
    <div class="card"><h2>Transactions</h2>${b.transactions.length ? '<table>' + b.transactions.map(h => `<tr><td>${hashCell(h, '#/tx/' + h)}</td></tr>`).join('') + '</table>' : '<div class="empty">No transactions.</div>'}</div>`;
}

async function route(ev, quiet){
  const app = $('#app');
  const [, kind, arg] = (location.hash || '#/').split('/');
  if (!quiet) app.innerHTML = '<div class="empty">Loading…</div>';
  try {
    if (kind === 'tx' && arg) app.innerHTML = await txPage(decodeURIComponent(arg));
    else if (kind === 'withdrawal' && arg) app.innerHTML = await wdPage(decodeURIComponent(arg));
    else if (kind === 'block' && arg) app.innerHTML = await blockPage(decodeURIComponent(arg));
    else app.innerHTML = await home();
  } catch (e) {
    app.innerHTML = `<div class="err">${esc(e.message)}</div><p><a href="#/">← back to overview</a></p>`;
  }
  if (!quiet) window.scrollTo(0, 0);
}

$('#search').addEventListener('submit', async e => {
  e.preventDefault(); const q = $('#q').value.trim(); if (!q) return;
  try { const r = await api('search?q=' + encodeURIComponent(q)); location.hash = '#/' + r.type + '/' + encodeURIComponent(r.target); }
  catch (err) { $('#app').innerHTML = `<div class="err">${esc(err.message)}</div><p><a href="#/">← back to overview</a></p>`; }
});
addEventListener('hashchange', route);
route();
setInterval(() => { if ((location.hash || '#/') === '#/' && !document.hidden) route(null, true); }, 15000);
</script>
</body>
</html>
